name: ROS 2 Jazzy

on:
  push:
    branches:
      - feature/multi_floor
  pull_request:
    branches:
      - feature/multi_floor

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    steps:
      - name: Create Workspace and checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build
        run: . /opt/ros/humble/setup.sh && ./.github/workflows/setup.sh && colcon build
